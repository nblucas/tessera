services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
    ports:
      - "54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://tessera:tessera@db:5432/tessera
      DEMO_MODE: "true"
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  db-data:
